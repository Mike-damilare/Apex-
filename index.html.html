<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Apex Shopify Agency — Stores That Actually Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & TOKENS ──────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;
  --bg2:#0f0f0f;
  --card:#141414;
  --gold:#C9A84C;
  --gold-lt:#E2C068;
  --gold-dk:#9B7A30;
  --sg:#96BF48;
  --sg-dk:#5E8E3E;
  --white:#F5F5F0;
  --grey:#666;
  --border:rgba(201,168,76,.15);
  --r:14px;
  --ff-d:'Bebas Neue',sans-serif;
  --ff-h:'Syne',sans-serif;
  --ff-b:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--ff-b);background:var(--bg);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.container{width:min(1160px,92%);margin:0 auto;padding-left:max(1rem,4vw);padding-right:max(1rem,4vw);box-sizing:border-box}

/* ── PRELOADER ───────────────────────────────────────── */
#pl{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;transition:opacity .6s,visibility .6s}
#pl.out{opacity:0;visibility:hidden}
#pl img{width:110px;height:auto;opacity:0;transform:translateY(10px);animation:plIn .8s .2s cubic-bezier(.16,1,.3,1) forwards}
.pl-bar{width:100px;height:2px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden}
.pl-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--sg));animation:plBar 1.2s .5s ease forwards;width:0}
@keyframes plIn{to{opacity:1;transform:translateY(0)}}
@keyframes plBar{to{width:100%}}

/* ── HEADER ──────────────────────────────────────────── */
header{position:fixed;top:0;left:0;right:0;z-index:100;padding:.9rem 0;background:rgba(8,8,8,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);transition:padding .3s}
header .container{display:flex;align-items:center;justify-content:space-between}
.h-logo img{height:40px;width:auto}
.h-cta{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ff-h);font-size:.8rem;font-weight:700;padding:.6rem 1.4rem;background:var(--sg);color:#fff;border-radius:50px;box-shadow:0 4px 16px rgba(150,191,72,.3);transition:background .2s,transform .15s}
.h-cta:hover{background:var(--sg-dk);transform:translateY(-1px)}

/* ── HERO ────────────────────────────────────────────── */

.hero-gfx{position:absolute;inset:0;pointer-events:none}
.hero-gfx::before{content:'';position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.06) 0%,transparent 70%);top:-200px;right:-300px}
.hero-gfx::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(150,191,72,.04) 0%,transparent 70%);bottom:-100px;left:-200px}
.hero-grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.03) 1px,transparent 1px);background-size:80px 80px;opacity:.5}

.hero-label{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--ff-h);font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sg);margin-bottom:1.8rem;opacity:0;animation:fadeUp .6s .3s ease forwards}
.hero-label::before{content:'';width:24px;height:2px;background:var(--sg)}
.hero-h1{font-family:var(--ff-d);line-height:.92;letter-spacing:.02em;margin-bottom:1.5rem;opacity:0;animation:fadeUp .7s .45s ease forwards}
.hero-h1 em{color:var(--gold);font-style:normal}
.hero-sub{font-weight:300;line-height:1.72;color:rgba(245,245,240,.58);opacity:0;animation:fadeUp .7s .6s ease forwards}
.hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;opacity:0;animation:fadeUp .7s .75s ease forwards;justify-content:center}
.btn-gold{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--ff-h);font-size:.95rem;font-weight:700;padding:1rem 2.2rem;background:var(--gold);color:#080808;border-radius:50px;box-shadow:0 8px 32px rgba(201,168,76,.28);transition:background .2s,transform .15s,box-shadow .2s}
.btn-gold:hover{background:var(--gold-lt);transform:translateY(-2px);box-shadow:0 14px 40px rgba(201,168,76,.4)}
.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ff-h);font-size:.95rem;font-weight:600;padding:1rem 2.2rem;border:1.5px solid rgba(255,255,255,.15);border-radius:50px;color:rgba(255,255,255,.7);transition:border-color .2s,color .2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
/* Hero trust row */
.hero-trust{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:2rem;padding-top:1.6rem;border-top:1px solid rgba(255,255,255,.06);opacity:0;animation:fadeUp .7s .9s ease forwards}
.trust-badge img{height:54px;width:auto;transition:transform .25s}
.trust-badge:hover img{transform:scale(1.08)}
.trust-divider{width:1px;height:36px;background:rgba(255,255,255,.1)}
.trust-stat{font-family:var(--ff-h)}
.trust-stat strong{display:block;font-size:1.3rem;font-weight:800;color:var(--gold)}
.trust-stat span{font-size:.68rem;color:rgba(255,255,255,.38);letter-spacing:.08em;text-transform:uppercase}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── PROOF TICKER ────────────────────────────────────── */
#proof-ticker{padding:22px 0;background:var(--bg2);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;position:relative}
#proof-ticker::before,#proof-ticker::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:2;pointer-events:none}
#proof-ticker::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
#proof-ticker::after{right:0;background:linear-gradient(-90deg,var(--bg2),transparent)}
.ticker-track{display:flex;gap:0;width:max-content;animation:tickerLeft 28s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:.5rem;padding:0 2rem;border-right:1px solid rgba(255,255,255,.07);font-family:var(--ff-h);font-size:.8rem;white-space:nowrap}
.ticker-item .t-num{font-weight:800;color:var(--gold)}
.ticker-item .t-lbl{color:rgba(255,255,255,.4);font-weight:500}
.ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--sg)}
@keyframes tickerLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── SECTION COMMON ──────────────────────────────────── */
section{padding:88px 0}
.sec-label{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sg);display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.sec-label::before{content:'';width:20px;height:2px;background:var(--sg)}
.sec-h{font-family:var(--ff-d);font-size:clamp(2.6rem,5vw,4.5rem);letter-spacing:.03em;line-height:.95;margin-bottom:1rem}
.sec-h em{color:var(--gold);font-style:normal}
.sec-sub{font-size:1rem;color:rgba(245,245,240,.5);line-height:1.72;max-width:560px}
.sec-head-center{text-align:center;margin:0 auto 3rem}
.sec-head-center .sec-label{justify-content:center}
.sec-head-center .sec-sub{margin:0 auto}
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.fade-up.vis{opacity:1;transform:translateY(0)}

/* ── RESULTS SECTION ─────────────────────────────────── */
#results{background:var(--bg);padding:88px 0;overflow:hidden}
.results-ticker-wrap{overflow:hidden;position:relative;margin-top:2.5rem}
.results-ticker-wrap::before,
.results-ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:140px;z-index:2;pointer-events:none}
.results-ticker-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.results-ticker-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.rc-row{margin-bottom:1.2rem}
.rc-row:last-child{margin-bottom:0}
.rc-track{display:flex;gap:1.2rem;width:max-content;padding:.4rem 0}
.rc-track.l{animation:scrollL 42s linear infinite}
.rc-track.r{animation:scrollR 38s linear infinite}
.results-ticker-wrap:hover .rc-track{animation-play-state:paused}
@keyframes scrollL{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scrollR{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.rc{flex-shrink:0;width:270px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s;cursor:default}
.rc:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,.5);border-color:rgba(201,168,76,.35)}
.rc-img{height:160px;overflow:hidden;background:#111}
.rc-img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
.rc:hover .rc-img img{transform:scale(1.05)}
.rc-body{padding:.85rem 1rem}
.rc-num{font-family:var(--ff-d);font-size:1.55rem;letter-spacing:.03em;line-height:1}
.rc-lbl{font-family:var(--ff-h);font-size:.68rem;font-weight:600;color:rgba(245,245,240,.42);letter-spacing:.04em;margin-top:.15rem}
.rc-who{font-family:var(--ff-h);font-size:.6rem;font-weight:700;color:rgba(245,245,240,.2);text-transform:uppercase;letter-spacing:.1em;margin-top:.22rem}

/* Stats strip */
.stats-strip{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-width:900px;margin:2.5rem auto 0}
.stat-item{flex:1;padding:1.5rem 1rem;text-align:center;border-right:1px solid var(--border);position:relative}
.stat-item:last-child{border-right:none}
.stat-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stat-n{font-family:var(--ff-d);font-size:2.2rem;color:var(--gold);letter-spacing:.04em;line-height:1}
.stat-l{font-family:var(--ff-h);font-size:.65rem;font-weight:600;color:rgba(245,245,240,.35);letter-spacing:.1em;text-transform:uppercase;margin-top:.3rem}

/* ── SERVICES ────────────────────────────────────────── */
#services{background:var(--bg2)}
.services-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:2.5rem}
.svc{background:var(--card);padding:2.4rem 2.2rem;position:relative;overflow:hidden;transition:background .25s}
.svc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform .4s}
.svc:hover{background:#1c1c1c}
.svc:hover::before{transform:scaleX(1)}
.svc-n{position:absolute;top:1.4rem;right:1.6rem;font-family:var(--ff-d);font-size:3.5rem;color:rgba(201,168,76,.05);line-height:1}
.svc-icon{font-size:1.6rem;margin-bottom:1.2rem}
.svc-title{font-family:var(--ff-h);font-size:1.05rem;font-weight:700;margin-bottom:.6rem}
.svc-desc{font-size:.86rem;color:rgba(245,245,240,.48);line-height:1.7}
.svc-tag{display:inline-block;margin-top:1rem;font-family:var(--ff-h);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sg);background:rgba(150,191,72,.08);border:1px solid rgba(150,191,72,.2);padding:.22rem .6rem;border-radius:50px}

/* ── PROCESS ─────────────────────────────────────────── */
#process{background:var(--bg)}
.process-row{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:4rem;position:relative}
.process-row::before{content:'';position:absolute;top:36px;left:calc(12.5% + 36px);right:calc(12.5% + 36px);height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),rgba(201,168,76,.25),transparent)}
.proc{text-align:center;position:relative;z-index:1}
.proc-circle{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;font-size:1.7rem;transition:background .25s,box-shadow .25s}
.proc:hover .proc-circle{background:rgba(201,168,76,.08);box-shadow:0 0 0 8px rgba(201,168,76,.06)}
.proc-title{font-family:var(--ff-h);font-size:.92rem;font-weight:700;margin-bottom:.5rem}
.proc-desc{font-size:.8rem;color:rgba(245,245,240,.45);line-height:1.6}

/* ── PRICING ─────────────────────────────────────────── */
#pricing{background:var(--bg2)}
/* Free call */
.free-call{background:rgba(150,191,72,.05);border:1.5px solid rgba(150,191,72,.3);border-radius:var(--r);padding:2rem 2.4rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2rem;position:relative;overflow:hidden;margin-bottom:1.5rem;transition:border-color .25s,transform .25s}
.free-call:hover{border-color:rgba(150,191,72,.6);transform:translateY(-2px)}
.free-call::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--sg),transparent)}
.fc-badge{position:absolute;top:1rem;right:1rem;font-family:var(--ff-h);font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--sg);color:#fff;padding:.2rem .6rem;border-radius:50px}
.fc-eyebrow{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sg);margin-bottom:.5rem}
.fc-title{font-family:var(--ff-d);font-size:1.9rem;letter-spacing:.04em;line-height:1;margin-bottom:.35rem}
.fc-sub{font-size:.82rem;color:rgba(245,245,240,.42);font-style:italic;margin-bottom:1rem}
.fc-feats{display:flex;flex-wrap:wrap;gap:.4rem .9rem;list-style:none}
.fc-feats li{font-size:.78rem;color:rgba(245,245,240,.62);display:flex;align-items:center;gap:.38rem}
.fc-feats li::before{content:'✓';color:var(--sg);font-weight:700}
.fc-btn{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;font-family:var(--ff-h);font-size:.88rem;font-weight:700;padding:.9rem 1.8rem;border-radius:50px;background:var(--sg);color:#fff;box-shadow:0 8px 24px rgba(150,191,72,.28);transition:background .2s,transform .15s;flex-shrink:0}
.fc-btn:hover{background:var(--sg-dk);transform:translateY(-2px)}
/* 3 package cards */
.pkg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-bottom:0;margin-top:2.5rem}
.pkg{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2.2rem 2rem;position:relative;overflow:hidden;transition:transform .3s,border-color .3s}
.pkg:hover{transform:translateY(-4px)}
.pkg.hot{border-color:var(--gold);background:rgba(201,168,76,.03)}
.pkg.hot::after{content:'MOST POPULAR';position:absolute;top:1.1rem;right:1.1rem;font-family:var(--ff-h);font-size:.56rem;font-weight:800;letter-spacing:.12em;background:var(--gold);color:#080808;padding:.2rem .55rem;border-radius:50px}
.pkg-tier{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
.pkg-price{font-family:var(--ff-d);font-size:3rem;letter-spacing:.02em;line-height:1;margin-bottom:.2rem}
.pkg-note{font-size:.72rem;color:var(--grey);margin-bottom:.5rem}
.pkg-approx{font-size:.7rem;color:rgba(245,245,240,.3);margin-bottom:1.5rem}
.pkg-div{height:1px;background:var(--border);margin-bottom:1.5rem}
.pkg-feats{list-style:none;display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.8rem}
.pkg-feats li{display:flex;align-items:flex-start;gap:.55rem;font-size:.82rem;color:rgba(245,245,240,.62);line-height:1.45}
.pkg-feats li::before{content:'✓';color:var(--gold);font-weight:700;flex-shrink:0}
.pkg-best{margin-top:1.2rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.05);font-family:var(--ff-h);font-size:.68rem;color:rgba(245,245,240,.3)}
.pkg-best em{color:var(--gold-lt);font-style:normal}
.pkg-btn{display:block;width:100%;font-family:var(--ff-h);font-size:.86rem;font-weight:700;padding:.9rem;border-radius:50px;text-align:center;transition:background .2s,transform .15s,border-color .2s,color .2s;margin-top:1.4rem}
.pkg-btn.outline{border:1.5px solid rgba(255,255,255,.14);color:var(--white)}
.pkg-btn.outline:hover{border-color:var(--gold);color:var(--gold)}
.pkg-btn.fill{background:var(--gold);color:#080808;box-shadow:0 8px 24px rgba(201,168,76,.25)}
.pkg-btn.fill:hover{background:var(--gold-lt)}
/* Retainer */
.retainer{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2rem 2.4rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2rem;position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
.retainer:hover{border-color:rgba(201,168,76,.35);transform:translateY(-2px)}
.retainer::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ret-eyebrow{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.ret-title{font-family:var(--ff-d);font-size:1.8rem;letter-spacing:.04em;line-height:1;margin-bottom:.3rem}
.ret-price{font-family:var(--ff-d);font-size:2.4rem;color:var(--gold);line-height:1;margin-bottom:.2rem}
.ret-note{font-size:.72rem;color:var(--grey);margin-bottom:1rem}
.ret-feats{display:flex;flex-wrap:wrap;gap:.4rem .9rem;list-style:none}
.ret-feats li{font-size:.8rem;color:rgba(245,245,240,.62);display:flex;align-items:center;gap:.38rem}
.ret-feats li::before{content:'→';color:var(--gold)}
.ret-btn{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;font-family:var(--ff-h);font-size:.88rem;font-weight:700;padding:.9rem 1.8rem;border-radius:50px;background:var(--gold);color:#080808;box-shadow:0 8px 24px rgba(201,168,76,.25);transition:background .2s,transform .15s;flex-shrink:0}
.ret-btn:hover{background:var(--gold-lt);transform:translateY(-2px)}

/* ── FAQ ─────────────────────────────────────────────── */
#faq{background:var(--bg)}
.faq-list{display:flex;flex-direction:column;gap:.85rem;margin-top:2.5rem;max-width:780px;margin-left:auto;margin-right:auto}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .25s}
.faq-item:hover{border-color:rgba(201,168,76,.28)}
.faq-q{width:100%;background:none;border:none;text-align:left;padding:1.3rem 1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;font-family:var(--ff-h);font-size:.9rem;font-weight:700;color:var(--white);transition:color .2s}
.faq-q:hover{color:var(--gold)}
.faq-arr{width:22px;height:22px;border-radius:50%;background:rgba(201,168,76,.1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--gold);flex-shrink:0;transition:transform .3s,background .2s}
.faq-item.open .faq-arr{transform:rotate(180deg);background:rgba(201,168,76,.2)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .3s ease;font-size:.86rem;color:rgba(245,245,240,.55);line-height:1.75;padding:0 1.6rem}
.faq-item.open .faq-a{max-height:320px;padding:0 1.6rem 1.4rem}

/* ── FINAL CTA ───────────────────────────────────────── */
#cta-final{background:var(--bg2);text-align:center;position:relative;overflow:hidden}
#cta-final::before{content:'';position:absolute;width:800px;height:500px;background:radial-gradient(ellipse,rgba(201,168,76,.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.cta-inner{position:relative;z-index:1;max-width:700px;margin:0 auto}
.cta-inner .sec-label{justify-content:center;margin-bottom:1.2rem}
.cta-inner .sec-h{margin-bottom:1.2rem}
.cta-inner p{font-size:1rem;color:rgba(245,245,240,.5);li<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & TOKENS ──────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;
  --bg2:#0f0f0f;
  --card:#141414;
  --gold:#C9A84C;
  --gold-lt:#E2C068;
  --gold-dk:#9B7A30;
  --sg:#96BF48;
  --sg-dk:#5E8E3E;
  --white:#F5F5F0;
  --grey:#666;
  --border:rgba(201,168,76,.15);
  --r:14px;
  --ff-d:'Bebas Neue',sans-serif;
  --ff-h:'Syne',sans-serif;
  --ff-b:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--ff-b);background:var(--bg);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.container{width:min(1160px,92%);margin:0 auto;padding-left:max(1rem,4vw);padding-right:max(1rem,4vw);box-sizing:border-box}

/* ── PRELOADER ───────────────────────────────────────── */
#pl{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;transition:opacity .6s,visibility .6s}
#pl.out{opacity:0;visibility:hidden}
#pl img{width:110px;height:auto;opacity:0;transform:translateY(10px);animation:plIn .8s .2s cubic-bezier(.16,1,.3,1) forwards}
.pl-bar{width:100px;height:2px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden}
.pl-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--sg));animation:plBar 1.2s .5s ease forwards;width:0}
@keyframes plIn{to{opacity:1;transform:translateY(0)}}
@keyframes plBar{to{width:100%}}

/* ── HEADER ──────────────────────────────────────────── */
header{position:fixed;top:0;left:0;right:0;z-index:100;padding:.9rem 0;background:rgba(8,8,8,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);transition:padding .3s}
header .container{display:flex;align-items:center;justify-content:space-between}
.h-logo img{height:40px;width:auto}
.h-cta{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ff-h);font-size:.8rem;font-weight:700;padding:.6rem 1.4rem;background:var(--sg);color:#fff;border-radius:50px;box-shadow:0 4px 16px rgba(150,191,72,.3);transition:background .2s,transform .15s}
.h-cta:hover{background:var(--sg-dk);transform:translateY(-1px)}

/* ── HERO ────────────────────────────────────────────── */

.hero-gfx{position:absolute;inset:0;pointer-events:none}
.hero-gfx::before{content:'';position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.06) 0%,transparent 70%);top:-200px;right:-300px}
.hero-gfx::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(150,191,72,.04) 0%,transparent 70%);bottom:-100px;left:-200px}
.hero-grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.03) 1px,transparent 1px);background-size:80px 80px;opacity:.5}

.hero-label{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--ff-h);font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sg);margin-bottom:1.8rem;opacity:0;animation:fadeUp .6s .3s ease forwards}
.hero-label::before{content:'';width:24px;height:2px;background:var(--sg)}
.hero-h1{font-family:var(--ff-d);line-height:.92;letter-spacing:.02em;margin-bottom:1.5rem;opacity:0;animation:fadeUp .7s .45s ease forwards}
.hero-h1 em{color:var(--gold);font-style:normal}
.hero-sub{font-weight:300;line-height:1.72;color:rgba(245,245,240,.58);opacity:0;animation:fadeUp .7s .6s ease forwards}
.hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;opacity:0;animation:fadeUp .7s .75s ease forwards;justify-content:center}
.btn-gold{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--ff-h);font-size:.95rem;font-weight:700;padding:1rem 2.2rem;background:var(--gold);color:#080808;border-radius:50px;box-shadow:0 8px 32px rgba(201,168,76,.28);transition:background .2s,transform .15s,box-shadow .2s}
.btn-gold:hover{background:var(--gold-lt);transform:translateY(-2px);box-shadow:0 14px 40px rgba(201,168,76,.4)}
.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--ff-h);font-size:.95rem;font-weight:600;padding:1rem 2.2rem;border:1.5px solid rgba(255,255,255,.15);border-radius:50px;color:rgba(255,255,255,.7);transition:border-color .2s,color .2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
/* Hero trust row */
.hero-trust{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:2rem;padding-top:1.6rem;border-top:1px solid rgba(255,255,255,.06);opacity:0;animation:fadeUp .7s .9s ease forwards}
.trust-badge img{height:54px;width:auto;transition:transform .25s}
.trust-badge:hover img{transform:scale(1.08)}
.trust-divider{width:1px;height:36px;background:rgba(255,255,255,.1)}
.trust-stat{font-family:var(--ff-h)}
.trust-stat strong{display:block;font-size:1.3rem;font-weight:800;color:var(--gold)}
.trust-stat span{font-size:.68rem;color:rgba(255,255,255,.38);letter-spacing:.08em;text-transform:uppercase}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── PROOF TICKER ────────────────────────────────────── */
#proof-ticker{padding:22px 0;background:var(--bg2);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;position:relative}
#proof-ticker::before,#proof-ticker::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:2;pointer-events:none}
#proof-ticker::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
#proof-ticker::after{right:0;background:linear-gradient(-90deg,var(--bg2),transparent)}
.ticker-track{display:flex;gap:0;width:max-content;animation:tickerLeft 28s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:.5rem;padding:0 2rem;border-right:1px solid rgba(255,255,255,.07);font-family:var(--ff-h);font-size:.8rem;white-space:nowrap}
.ticker-item .t-num{font-weight:800;color:var(--gold)}
.ticker-item .t-lbl{color:rgba(255,255,255,.4);font-weight:500}
.ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--sg)}
@keyframes tickerLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── SECTION COMMON ──────────────────────────────────── */
section{padding:88px 0}
.sec-label{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sg);display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.sec-label::before{content:'';width:20px;height:2px;background:var(--sg)}
.sec-h{font-family:var(--ff-d);font-size:clamp(2.6rem,5vw,4.5rem);letter-spacing:.03em;line-height:.95;margin-bottom:1rem}
.sec-h em{color:var(--gold);font-style:normal}
.sec-sub{font-size:1rem;color:rgba(245,245,240,.5);line-height:1.72;max-width:560px}
.sec-head-center{text-align:center;margin:0 auto 3rem}
.sec-head-center .sec-label{justify-content:center}
.sec-head-center .sec-sub{margin:0 auto}
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.fade-up.vis{opacity:1;transform:translateY(0)}

/* ── RESULTS SECTION ─────────────────────────────────── */
#results{background:var(--bg);padding:88px 0;overflow:hidden}
.results-ticker-wrap{overflow:hidden;position:relative;margin-top:2.5rem}
.results-ticker-wrap::before,
.results-ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:140px;z-index:2;pointer-events:none}
.results-ticker-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.results-ticker-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.rc-row{margin-bottom:1.2rem}
.rc-row:last-child{margin-bottom:0}
.rc-track{display:flex;gap:1.2rem;width:max-content;padding:.4rem 0}
.rc-track.l{animation:scrollL 42s linear infinite}
.rc-track.r{animation:scrollR 38s linear infinite}
.results-ticker-wrap:hover .rc-track{animation-play-state:paused}
@keyframes scrollL{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scrollR{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.rc{flex-shrink:0;width:270px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s;cursor:default}
.rc:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,.5);border-color:rgba(201,168,76,.35)}
.rc-img{height:160px;overflow:hidden;background:#111}
.rc-img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
.rc:hover .rc-img img{transform:scale(1.05)}
.rc-body{padding:.85rem 1rem}
.rc-num{font-family:var(--ff-d);font-size:1.55rem;letter-spacing:.03em;line-height:1}
.rc-lbl{font-family:var(--ff-h);font-size:.68rem;font-weight:600;color:rgba(245,245,240,.42);letter-spacing:.04em;margin-top:.15rem}
.rc-who{font-family:var(--ff-h);font-size:.6rem;font-weight:700;color:rgba(245,245,240,.2);text-transform:uppercase;letter-spacing:.1em;margin-top:.22rem}

/* Stats strip */
.stats-strip{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-width:900px;margin:2.5rem auto 0}
.stat-item{flex:1;padding:1.5rem 1rem;text-align:center;border-right:1px solid var(--border);position:relative}
.stat-item:last-child{border-right:none}
.stat-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stat-n{font-family:var(--ff-d);font-size:2.2rem;color:var(--gold);letter-spacing:.04em;line-height:1}
.stat-l{font-family:var(--ff-h);font-size:.65rem;font-weight:600;color:rgba(245,245,240,.35);letter-spacing:.1em;text-transform:uppercase;margin-top:.3rem}

/* ── SERVICES ────────────────────────────────────────── */
#services{background:var(--bg2)}
.services-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:2.5rem}
.svc{background:var(--card);padding:2.4rem 2.2rem;position:relative;overflow:hidden;transition:background .25s}
.svc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform .4s}
.svc:hover{background:#1c1c1c}
.svc:hover::before{transform:scaleX(1)}
.svc-n{position:absolute;top:1.4rem;right:1.6rem;font-family:var(--ff-d);font-size:3.5rem;color:rgba(201,168,76,.05);line-height:1}
.svc-icon{font-size:1.6rem;margin-bottom:1.2rem}
.svc-title{font-family:var(--ff-h);font-size:1.05rem;font-weight:700;margin-bottom:.6rem}
.svc-desc{font-size:.86rem;color:rgba(245,245,240,.48);line-height:1.7}
.svc-tag{display:inline-block;margin-top:1rem;font-family:var(--ff-h);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sg);background:rgba(150,191,72,.08);border:1px solid rgba(150,191,72,.2);padding:.22rem .6rem;border-radius:50px}

/* ── PROCESS ─────────────────────────────────────────── */
#process{background:var(--bg)}
.process-row{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:4rem;position:relative}
.process-row::before{content:'';position:absolute;top:36px;left:calc(12.5% + 36px);right:calc(12.5% + 36px);height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),rgba(201,168,76,.25),transparent)}
.proc{text-align:center;position:relative;z-index:1}
.proc-circle{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;font-size:1.7rem;transition:background .25s,box-shadow .25s}
.proc:hover .proc-circle{background:rgba(201,168,76,.08);box-shadow:0 0 0 8px rgba(201,168,76,.06)}
.proc-title{font-family:var(--ff-h);font-size:.92rem;font-weight:700;margin-bottom:.5rem}
.proc-desc{font-size:.8rem;color:rgba(245,245,240,.45);line-height:1.6}

/* ── PRICING ─────────────────────────────────────────── */
#pricing{background:var(--bg2)}
/* Free call */
.free-call{background:rgba(150,191,72,.05);border:1.5px solid rgba(150,191,72,.3);border-radius:var(--r);padding:2rem 2.4rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2rem;position:relative;overflow:hidden;margin-bottom:1.5rem;transition:border-color .25s,transform .25s}
.free-call:hover{border-color:rgba(150,191,72,.6);transform:translateY(-2px)}
.free-call::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--sg),transparent)}
.fc-badge{position:absolute;top:1rem;right:1rem;font-family:var(--ff-h);font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--sg);color:#fff;padding:.2rem .6rem;border-radius:50px}
.fc-eyebrow{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sg);margin-bottom:.5rem}
.fc-title{font-family:var(--ff-d);font-size:1.9rem;letter-spacing:.04em;line-height:1;margin-bottom:.35rem}
.fc-sub{font-size:.82rem;color:rgba(245,245,240,.42);font-style:italic;margin-bottom:1rem}
.fc-feats{display:flex;flex-wrap:wrap;gap:.4rem .9rem;list-style:none}
.fc-feats li{font-size:.78rem;color:rgba(245,245,240,.62);display:flex;align-items:center;gap:.38rem}
.fc-feats li::before{content:'✓';color:var(--sg);font-weight:700}
.fc-btn{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;font-family:var(--ff-h);font-size:.88rem;font-weight:700;padding:.9rem 1.8rem;border-radius:50px;background:var(--sg);color:#fff;box-shadow:0 8px 24px rgba(150,191,72,.28);transition:background .2s,transform .15s;flex-shrink:0}
.fc-btn:hover{background:var(--sg-dk);transform:translateY(-2px)}
/* 3 package cards */
.pkg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-bottom:0;margin-top:2.5rem}
.pkg{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2.2rem 2rem;position:relative;overflow:hidden;transition:transform .3s,border-color .3s}
.pkg:hover{transform:translateY(-4px)}
.pkg.hot{border-color:var(--gold);background:rgba(201,168,76,.03)}
.pkg.hot::after{content:'MOST POPULAR';position:absolute;top:1.1rem;right:1.1rem;font-family:var(--ff-h);font-size:.56rem;font-weight:800;letter-spacing:.12em;background:var(--gold);color:#080808;padding:.2rem .55rem;border-radius:50px}
.pkg-tier{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
.pkg-price{font-family:var(--ff-d);font-size:3rem;letter-spacing:.02em;line-height:1;margin-bottom:.2rem}
.pkg-note{font-size:.72rem;color:var(--grey);margin-bottom:.5rem}
.pkg-approx{font-size:.7rem;color:rgba(245,245,240,.3);margin-bottom:1.5rem}
.pkg-div{height:1px;background:var(--border);margin-bottom:1.5rem}
.pkg-feats{list-style:none;display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.8rem}
.pkg-feats li{display:flex;align-items:flex-start;gap:.55rem;font-size:.82rem;color:rgba(245,245,240,.62);line-height:1.45}
.pkg-feats li::before{content:'✓';color:var(--gold);font-weight:700;flex-shrink:0}
.pkg-best{margin-top:1.2rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.05);font-family:var(--ff-h);font-size:.68rem;color:rgba(245,245,240,.3)}
.pkg-best em{color:var(--gold-lt);font-style:normal}
.pkg-btn{display:block;width:100%;font-family:var(--ff-h);font-size:.86rem;font-weight:700;padding:.9rem;border-radius:50px;text-align:center;transition:background .2s,transform .15s,border-color .2s,color .2s;margin-top:1.4rem}
.pkg-btn.outline{border:1.5px solid rgba(255,255,255,.14);color:var(--white)}
.pkg-btn.outline:hover{border-color:var(--gold);color:var(--gold)}
.pkg-btn.fill{background:var(--gold);color:#080808;box-shadow:0 8px 24px rgba(201,168,76,.25)}
.pkg-btn.fill:hover{background:var(--gold-lt)}
/* Retainer */
.retainer{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2rem 2.4rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2rem;position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
.retainer:hover{border-color:rgba(201,168,76,.35);transform:translateY(-2px)}
.retainer::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ret-eyebrow{font-family:var(--ff-h);font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.ret-title{font-family:var(--ff-d);font-size:1.8rem;letter-spacing:.04em;line-height:1;margin-bottom:.3rem}
.ret-price{font-family:var(--ff-d);font-size:2.4rem;color:var(--gold);line-height:1;margin-bottom:.2rem}
.ret-note{font-size:.72rem;color:var(--grey);margin-bottom:1rem}
.ret-feats{display:flex;flex-wrap:wrap;gap:.4rem .9rem;list-style:none}
.ret-feats li{font-size:.8rem;color:rgba(245,245,240,.62);display:flex;align-items:center;gap:.38rem}
.ret-feats li::before{content:'→';color:var(--gold)}
.ret-btn{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;font-family:var(--ff-h);font-size:.88rem;font-weight:700;padding:.9rem 1.8rem;border-radius:50px;background:var(--gold);color:#080808;box-shadow:0 8px 24px rgba(201,168,76,.25);transition:background .2s,transform .15s;flex-shrink:0}
.ret-btn:hover{background:var(--gold-lt);transform:translateY(-2px)}

/* ── FAQ ─────────────────────────────────────────────── */
#faq{background:var(--bg)}
.faq-list{display:flex;flex-direction:column;gap:.85rem;margin-top:2.5rem;max-width:780px;margin-left:auto;margin-right:auto}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .25s}
.faq-item:hover{border-color:rgba(201,168,76,.28)}
.faq-q{width:100%;background:none;border:none;text-align:left;padding:1.3rem 1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;font-family:var(--ff-h);font-size:.9rem;font-weight:700;color:var(--white);transition:color .2s}
.faq-q:hover{color:var(--gold)}
.faq-arr{width:22px;height:22px;border-radius:50%;background:rgba(201,168,76,.1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--gold);flex-shrink:0;transition:transform .3s,background .2s}
.faq-item.open .faq-arr{transform:rotate(180deg);background:rgba(201,168,76,.2)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .3s ease;font-size:.86rem;color:rgba(245,245,240,.55);line-height:1.75;padding:0 1.6rem}
.faq-item.open .faq-a{max-height:320px;padding:0 1.6rem 1.4rem}

/* ── FINAL CTA ───────────────────────────────────────── */
#cta-final{background:var(--bg2);text-align:center;position:relative;overflow:hidden}
#cta-final::before{content:'';position:absolute;width:800px;height:500px;background:radial-gradient(ellipse,rgba(201,168,76,.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.cta-inner{position:relative;z-index:1;max-width:700px;margin:0 auto}
.cta-inner .sec-label{justify-content:center;margin-bottom:1.2rem}
.cta-inner .sec-h{margin-bottom:1.2rem}
.cta-inner p{font-size:1rem;color:rgba(245,245,240,.5);li
